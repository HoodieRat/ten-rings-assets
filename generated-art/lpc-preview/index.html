<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LPC Preview</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 24px; }
    img { image-rendering: pixelated; border: 1px solid #444; background: #222; max-width: 100%; }
    .grid { display: grid; gap: 24px; }
    .card { padding: 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; }
    a { color: #8ecbff; }
  </style>
</head>
<body>
  <h1>TenRings LPC preview</h1>
  <p>Generated LPC runtime preview for Fractureborn rogue.</p>
  <div class="grid">
    <div class="card">
      <h2>Walk spritesheet</h2>
      <img src="fractureborn-rogue-walk.png" alt="Fractureborn rogue walk spritesheet" />
    </div>
    <div class="card">
      <h2>Portrait</h2>
      <img src="fractureborn-rogue-portrait.png" alt="Fractureborn rogue portrait" />
    </div>
  </div>
</body>
</html>
